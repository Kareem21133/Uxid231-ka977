<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transit App | Sign in</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>

  <body class="auth-page">
    <main>
      <a href="welcome.html" class="icon-button" aria-label="Back to welcome">
        <span class="material-icons" aria-hidden="true">arrow_back</span>
      </a>

      <h1>Welcome back</h1>
      <p class="auth-intro">Sign in to pick up where you left off.</p>

      <form class="auth-form" action="index.html">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
        />

        <a href="#" class="forgot-link">Forgot password?</a>
        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>

      <p class="auth-switch">
        New to Transit App? <a href="sign-up.html">Create an account</a>
      </p>
    </main>

    <footer>
      <p>Transit App</p>
    </footer>
  </body>
</html>
