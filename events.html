<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transit App | Events</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>

  <body>
    <main>
      <h1>Events Near You</h1>

      <!-- link to the bars page -->
      <p><a href="bars.html">See bars near you</a></p>

      <section>
        <article class="event-card">
          <h2>Happy Hour Meetup</h2>
          <p>Today, 5:30 PM.</p>
          <p>Good Good Things</p>
          <img
            class="event-img"
            src="images/good-good-things.png"
            alt="Interior of a bar with candlelit tables and framed portraits"
          />
          <a href="event-detail.html">View event</a>
        </article>

        <article class="event-card">
          <h2>Concert</h2>
          <p>Tomorrow, 8:00 PM.</p>
          <p>Xfinity Arena</p>
          <img
            class="event-img"
            src="images/xfinity-arena.png"
            alt="Xfinity Mobile Arena exterior lit up in purple lights"
          />
          <a href="event-detail.html">View event</a>
        </article>

        <article class="event-card">
          <h2>Coffee Study Group</h2>
          <p>Tomorrow, 4:00 PM.</p>
          <p>Madis</p>
          <img
            class="event-img"
            src="images/madis.png"
            alt="Madis coffee shop sign"
          />
          <a href="event-detail.html">View event</a>
        </article>
      </section>
    </main>
    <nav class="tab-bar" aria-label="Main">
      <a href="index.html">
        <span class="material-icons" aria-hidden="true">home</span>
        Home
      </a>
      <a href="events.html" aria-current="page">
        <span class="material-icons" aria-hidden="true">event</span>
        Events
      </a>
      <a href="friends.html">
        <span class="material-icons" aria-hidden="true">group</span>
        Friends
      </a>
      <a href="account.html">
        <span class="material-icons" aria-hidden="true">person</span>
        Account
      </a>
    </nav>

    <footer>
      <p>Transit App</p>
    </footer>
  </body>
</html>
