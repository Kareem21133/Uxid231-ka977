<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transit App | Sign up</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>

  <body class="auth-page">
    <main>
      <a href="welcome.html" class="icon-button" aria-label="Back to welcome">
        <span class="material-icons" aria-hidden="true">arrow_back</span>
      </a>

      <h1>Create your account</h1>
      <p class="auth-intro">It takes less than a minute.</p>

      <form class="auth-form" action="index.html">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name" />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" />

        <label for="password">Password</label>
        <p class="field-hint" id="password-hint">At least 8 characters</p>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="new-password"
          aria-describedby="password-hint"
        />

        <label for="birthday">Date of birth</label>
        <input type="date" id="birthday" name="birthday" autocomplete="bday" />

        <button type="submit" class="btn btn-primary">Create account</button>
      </form>

      <p class="auth-switch">
        Already have an account? <a href="sign-in.html">Sign in</a>
      </p>
    </main>

    <footer>
      <p>Transit App</p>
    </footer>
  </body>
</html>
